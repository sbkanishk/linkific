services:
  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
      - cache

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: password123

  cache:
    image: redis:alpine

volumes:
  postgres_data: