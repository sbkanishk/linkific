version: '3.8'

services:
  # 1. Our Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: fastapi_cache_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # 2. Our FastAPI Web App Service
  web:
    build: .
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - redis

volumes:
  redis_data: